<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><link rel="stylesheet" href="assets/accessibility.css"><script defer src="assets/a11y.js"></script><title>AI副業8問診断｜上位2候補と次の練習</title><style>
:root{--ink:#1e2522;--bg:#eef3ed;--paper:#fff;--green:#176b5f;--lime:#dbe86b;--red:#c74c35;--line:#cbd6ce}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.7 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}button,a{font:inherit}.shell{width:min(900px,calc(100% - 32px));margin:auto}.top{padding:34px 0 16px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900}.top a{font-size:15px;color:inherit}.stage{min-height:720px;background:var(--paper);border:1px solid var(--line);border-radius:28px;overflow:hidden;box-shadow:0 20px 55px #25482d1a}.intro{display:grid;grid-template-columns:1fr 320px;gap:34px;padding:54px}.intro img{width:100%;border-radius:18px}.eyebrow{color:var(--red);font-weight:900}h1{font-size:clamp(40px,7vw,68px);line-height:1.04;letter-spacing:-.05em;margin:10px 0 20px}.intro p{font-size:20px}.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:24px 0}.facts span{padding:12px;background:var(--bg);border-radius:10px;text-align:center;font-size:14px;font-weight:800}.primary,.next,.print{min-height:50px;border:0;border-radius:999px;padding:10px 24px;background:var(--green);color:white;font-weight:900;cursor:pointer}.quiz{display:none;padding:40px 54px}.progress-row{display:flex;gap:16px;align-items:center;margin-bottom:45px}.progress{height:10px;background:#e4e9e5;border-radius:99px;overflow:hidden;flex:1}.bar{height:100%;width:0;background:var(--green);transition:width .25s}.count{font-weight:900;font-size:15px}.question h2{font-size:clamp(28px,5vw,43px);line-height:1.25;margin:0 0 28px}.options{display:grid;gap:12px}.choice{position:relative}.choice input{position:absolute;opacity:0}.choice label{display:flex;align-items:center;min-height:62px;padding:14px 18px;border:2px solid var(--line);border-radius:14px;cursor:pointer;font-weight:700}.choice input:focus-visible+label{outline:3px solid var(--lime);outline-offset:3px}.choice input:checked+label{border-color:var(--green);background:#e4f2ed}.choice input:checked+label:before{content:"✓";display:grid;place-items:center;width:28px;height:28px;margin-right:12px;border-radius:50%;background:var(--green);color:white}.controls{display:flex;justify-content:space-between;margin-top:35px}.back{min-height:48px;border:0;background:transparent;text-decoration:underline;cursor:pointer}.next:disabled{opacity:.35;cursor:not-allowed}.result{display:none;padding:48px 54px}.result-head{display:grid;grid-template-columns:1fr 180px;gap:26px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:30px}.result-head h2{font-size:clamp(34px,6vw,58px);line-height:1.1;margin:7px 0}.result-head img{border-radius:50%}.ranks{display:grid;gap:18px;margin:34px 0}.rank{display:grid;grid-template-columns:76px 1fr;gap:20px;padding:25px;border:2px solid var(--line);border-radius:18px}.rank:first-child{border-color:var(--green);background:#eff8f4}.medal{width:64px;height:64px;display:grid;place-items:center;border-radius:50%;background:var(--ink);color:white;font-weight:900;font-size:25px}.rank:first-child .medal{background:var(--green)}.rank h3{font-size:28px;margin:0 0 6px}.reason{margin:0}.next-step{margin-top:14px;padding:14px;border-left:5px solid var(--red);background:#fff8ef}.device-note{padding:22px;background:var(--bg);border-radius:14px}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:25px}.restart{min-height:48px;border:2px solid var(--ink);background:white;border-radius:999px;padding:8px 20px;font-weight:900;cursor:pointer}.small{font-size:14px;color:#5c655f}.error{color:#a52920;min-height:28px;margin-top:12px}@media(max-width:700px){.stage{min-height:0}.intro{grid-template-columns:1fr;padding:30px 24px}.intro img{order:-1;max-width:230px;margin:auto}.quiz,.result{padding:30px 24px}.facts{grid-template-columns:1fr}.result-head{grid-template-columns:1fr}.result-head img{display:none}.rank{grid-template-columns:52px 1fr;padding:18px}.medal{width:50px;height:50px}.rank h3{font-size:23px}}@media(max-width:390px){.shell{width:calc(100% - 20px)}.quiz,.result{padding:26px 17px}.choice label{padding:12px;min-height:58px}.controls{gap:8px}.next{padding-inline:18px}}@media print{body{background:white}.top,.intro,.quiz,.actions{display:none!important}.stage{box-shadow:none;border:0;min-height:0}.result{display:block!important;padding:0}.result-head{grid-template-columns:1fr}.result-head img{display:none}.rank{break-inside:avoid}.small{display:none}@page{margin:14mm}}
</style></head><body><div class="shell"><header class="top"><div class="brand">AI副業8問診断</div><a href="https://yuuyann0318.github.io/ai-fukugyo-bonus-hub/">特典入口へ</a></header><main class="stage"><section class="intro" id="intro"><div><div class="eyebrow">上位2候補と、次の練習が分かる</div><h1>8問で、<br>始める順を決める。</h1><p>適性を決めつける診断ではありません。今日どれから試すかを、5つの仕事から絞ります。</p><div class="facts"><span>所要 約3分</span><span>登録なし</span><span>結果を印刷</span></div><button class="primary" id="start">診断を始める</button></div><img src="assets/display/cover.jpg" fetchpriority="high" alt="AI副業8問診断の表紙"></section><section class="quiz" id="quiz"><div class="progress-row"><div class="progress" aria-hidden="true"><div class="bar" id="bar"></div></div><div class="count" id="count"></div></div><div class="question" id="question"></div><div class="error" id="error" role="alert"></div><div class="controls"><button class="back" id="back">戻る</button><button class="next" id="next" disabled>次へ</button></div></section><section class="result" id="result"><div class="result-head"><div><div class="eyebrow">診断結果</div><h2>まず、この2つを<br>試してみましょう。</h2><p>点数は向き不向きの証明ではなく、回答に近い練習の順番です。</p></div><img src="assets/display/01-smartphone-writing-practice.jpg" loading="lazy" alt="スマホで文章を練習するイメージ"></div><div class="ranks" id="ranks"></div><div class="device-note" id="deviceNote"></div><div class="actions"><button class="print" onclick="window.print()">結果を印刷・PDF保存</button><button class="restart" id="restart">最初からやり直す</button></div><p class="small">印刷画面で「PDFとして保存」を選ぶと、結果を保存できます。</p></section></main></div><script>
const jobs={post:{name:'SNS投稿文',reason:'短い文章へ整え、伝えたい事実を読みやすく並べる仕事です。',step:'架空のカフェ情報を4行にし、80〜120字の投稿文を1つ保存する。',pc:'スマホだけでも始めやすい'},design:{name:'告知画像',reason:'写真・色・文字の順番を考え、1枚で伝える仕事です。',step:'文字なし背景を1枚保存し、行事名と日時を載せてPNGにする。',pc:'スマホだけでも始めやすい'},product:{name:'商品説明文',reason:'商品の違いと注意点を、買う人が迷わない順に説明する仕事です。',step:'身近な商品を「内容・使い方・未確認」の3つに分ける。',pc:'スマホでも、パソコンでも進められる'},reply:{name:'問い合わせ返信',reason:'相手の質問を見落とさず、確認事項と返事を分ける仕事です。',step:'架空の問い合わせを「要点・返信案・確認」に分ける。',pc:'スマホでも、パソコンでも進められる'},video:{name:'ショート動画の下準備',reason:'音声の意味に合わせ、字幕と画像の順番を組み立てる仕事です。',step:'15秒の文章を3つに区切り、それぞれに合う画像を決める。',pc:'本格的な編集はパソコンがあると進めやすい'}};
const Q=[
{q:'作るなら、どちらが気になりますか？',a:[['文章を整える',{post:2,product:2,reply:1}],['写真や色を整える',{design:3,video:1}],['どちらも試したい',{post:1,design:1,product:1,reply:1,video:1}]]},
{q:'人からの質問へ答える作業は？',a:[['苦にならない',{reply:3,product:1}],['内容による',{reply:1,post:1,product:1}],['別の作業から試したい',{design:1,video:1}]]},
{q:'最初の練習に使えそうな時間は？',a:[['10〜20分ほど',{post:2,reply:2,design:1}],['30〜60分ほど',{product:2,design:2,reply:1}],['パソコンで1時間以上も試せる',{video:3,product:1}]]},
{q:'色や写真の組み合わせを考えたいですか？',a:[['考えてみたい',{design:3,video:2}],['少しなら',{design:1,post:1,product:1}],['文章を優先したい',{post:2,reply:2,product:1}]]},
{q:'AIの答えを、元資料と見直す作業は？',a:[['1つずつ確認したい',{product:2,reply:2,post:1}],['見本があれば確認できそう',{post:1,design:1,product:1,reply:1,video:1}],['まず見た目や流れから確認したい',{design:2,video:2}]]},
{q:'音声に合わせて画像を選ぶ作業は？',a:[['興味がある',{video:4,design:1}],['少し興味がある',{video:2,design:1}],['文章や静止画から始めたい',{post:1,design:1,reply:1,product:1}]]},
{q:'主に使える端末は？',device:true,a:[['スマホだけ',{post:1,design:2,reply:1,product:1}],['スマホとパソコン',{post:1,design:1,reply:1,product:1,video:2}],['パソコン中心',{product:1,reply:1,video:3}]]},
{q:'最初の練習で、何を完成させたいですか？',goal:true,a:[['短い文章',{post:4,reply:2}],['告知画像',{design:5}],['商品やサービスの説明',{product:5}],['問い合わせへの返事',{reply:5}],['字幕つきの短い動画',{video:5}]]}
];
let i=0,answers=Array(Q.length).fill(null);const $=s=>document.querySelector(s);const intro=$('#intro'),quiz=$('#quiz'),result=$('#result'),question=$('#question'),next=$('#next'),back=$('#back'),error=$('#error');
function show(){const x=Q[i];$('#count').textContent=`${i+1} / ${Q.length}`;$('#bar').style.width=`${(i+1)/Q.length*100}%`;question.innerHTML=`<h2>${x.q}</h2><div class="options">${x.a.map((o,n)=>`<div class="choice"><input type="radio" name="answer" id="a${n}" value="${n}" ${answers[i]===n?'checked':''}><label for="a${n}">${o[0]}</label></div>`).join('')}</div>`;next.textContent=i===Q.length-1?'結果を見る':'次へ';next.disabled=answers[i]===null;back.style.visibility=i===0?'hidden':'visible';error.textContent='';question.querySelectorAll('input').forEach(el=>el.addEventListener('change',e=>{answers[i]=+e.target.value;next.disabled=false;error.textContent=''}));}
$('#start').onclick=()=>{intro.style.display='none';quiz.style.display='block';show();};back.onclick=()=>{if(i>0){i--;show()}};next.onclick=()=>{if(answers[i]===null){error.textContent='1つ選んでから進んでください。';return}if(i<Q.length-1){i++;show()}else finish()};
const order=['post','design','product','reply','video'];
function scoreAnswers(selected){const score=Object.fromEntries(order.map(k=>[k,0]));selected.forEach((n,qi)=>Object.entries(Q[qi].a[n][1]).forEach(([k,v])=>score[k]+=v));return score}
function rankAnswers(selected){const score=scoreAnswers(selected),goal=Q[7].a[selected[7]][1],first=Q[0].a[selected[0]][1];return order.slice().sort((a,b)=>score[b]-score[a]||(goal[b]||0)-(goal[a]||0)||(first[b]||0)-(first[a]||0)||order.indexOf(a)-order.indexOf(b))}
function reasonFor(k,selected){const evidence=selected.map((n,qi)=>({label:Q[qi].a[n][0],points:Q[qi].a[n][1][k]||0,qi})).filter(x=>x.points>0).sort((a,b)=>b.points-a.points||a.qi-b.qi).slice(0,2);const chosen=evidence.map(x=>`「${x.label}」`).join('、');return `あなたが${chosen}と答えたことが、この候補につながりました。${jobs[k].reason}`}
function finish(){const sorted=rankAnswers(answers);$('#ranks').innerHTML=sorted.slice(0,2).map((k,n)=>`<article class="rank" data-job="${k}"><div class="medal">${n+1}</div><div><h3>${jobs[k].name}</h3><p class="reason">${reasonFor(k,answers)}</p><div class="next-step"><b>次の練習</b><br>${jobs[k].step}</div><p><b>端末：</b>${jobs[k].pc}</p></div></article>`).join('');const device=answers[6];const hasVideo=sorted.slice(0,2).includes('video');$('#deviceNote').innerHTML=device===0&&hasVideo?'<b>スマホ中心の方へ</b><br>動画の下準備は候補に残しました。まずスマホで台本を3つに区切り、編集はパソコンを使えるときに進めてください。':'<b>端末について</b><br>上の練習は、いま使える端末から始められます。動画編集まで進む場合はパソコンがあると進めやすくなります。';quiz.style.display='none';result.style.display='block';window.scrollTo({top:0,behavior:'smooth'});}
$('#restart').onclick=()=>{i=0;answers.fill(null);result.style.display='none';intro.style.display='grid';};
</script></body></html>
